[project]
name = "app"
version = "0.1.0"
description = "MCP CLI Chat - Anthropic Academy Project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.8.0,<2",
    "openai>=1.0.0",
    "prompt-toolkit>=3.0.51",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
